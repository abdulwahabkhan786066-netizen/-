<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
  </defs>
  <!-- Background with safe zone -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  
  <!-- Outer ring for maskable safety -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#10b981" stroke-width="6" opacity="0.3" />

  <!-- Sun Rays in Background -->
  <g opacity="0.25">
    <circle cx="256" cy="230" r="140" fill="#fef08a" />
  </g>

  <!-- Ground / Farmland Furrows -->
  <path d="M64 390 C160 360, 350 360, 448 390 L448 440 C350 460, 160 460, 64 440 Z" fill="#022c22" />
  <path d="M100 410 C180 395, 330 395, 412 410" stroke="#10b981" stroke-width="4" stroke-linecap="round" fill="none" />

  <!-- Center Golden Wheat Sheaf -->
  <g id="wheat" fill="url(#goldGrad)" stroke="#ca8a04" stroke-width="2">
    <!-- Central Stalk -->
    <path d="M256 360 L256 140" stroke="#facc15" stroke-width="6" stroke-linecap="round" />
    
    <!-- Grains -->
    <!-- Top Grain -->
    <ellipse cx="256" cy="130" rx="14" ry="24" />
    <!-- Left & Right Pairs -->
    <ellipse cx="236" cy="165" rx="15" ry="24" transform="rotate(-30 236 165)" />
    <ellipse cx="276" cy="165" rx="15" ry="24" transform="rotate(30 276 165)" />
    
    <ellipse cx="230" cy="205" rx="16" ry="25" transform="rotate(-35 230 205)" />
    <ellipse cx="282" cy="205" rx="16" ry="25" transform="rotate(35 282 205)" />

    <ellipse cx="226" cy="245" rx="16" ry="25" transform="rotate(-40 226 245)" />
    <ellipse cx="286" cy="245" rx="16" ry="25" transform="rotate(40 286 245)" />

    <ellipse cx="224" cy="285" rx="16" ry="25" transform="rotate(-40 224 285)" />
    <ellipse cx="288" cy="285" rx="16" ry="25" transform="rotate(40 288 285)" />
  </g>

  <!-- Green Growth Leaves -->
  <path d="M256 320 Q200 300, 180 250 Q215 260, 256 300 Z" fill="#34d399" />
  <path d="M256 320 Q312 300, 332 250 Q297 260, 256 300 Z" fill="#34d399" />

  <!-- Urdu Text / Brand Mark at bottom -->
  <text x="256" y="445" font-family="system-ui, sans-serif" font-weight="bold" font-size="28" fill="#fef3c7" text-anchor="middle" letter-spacing="1">KISAN BAZAAR</text>
</svg>
